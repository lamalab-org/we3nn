[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "we3nn"
version = "0.4.0"
description = "e3nn-style equivariant neural-network primitives for finite cyclic and dihedral groups"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "we3nn contributors" }]
dependencies = ["torch>=2.0", "e3nn>=0.6,<0.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
reference = ["escnn>=1.0"]
message-passing = []
notebooks = ["ipykernel>=6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["we3nn*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "escnn: cross-library verification against escnn",
    "slow: exhaustive mathematical or performance validation",
]
